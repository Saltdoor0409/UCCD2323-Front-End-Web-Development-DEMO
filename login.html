<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI & Innovation Club</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-primary: #f8f9fa;
            --text-primary: #212529;
            --card-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #ffffff;
            --input-border: #dee2e6;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden; s
        }


        .hero-section {
            background: linear-gradient(135deg, #0b0f19 0%, #1a2a6c 50%, #b21f1f 100%);
            background-size: 200% 200%;
            animation: gradientMove 6s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            color: #ffffff;
        }


        .glass-input {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #ffffff !important;
            border-radius: 10px;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3) !important;
            border-color: #ffffff !important;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }


        .invalid-feedback {
            color: #ffb3b3;
        }
    </style>
</head>

<body>

    <a href="index.html" class="btn btn-outline-light position-absolute top-0 start-0 m-4 rounded-pill px-3" style="z-index: 10;">
        <i class="bi bi-arrow-left me-1"></i> Back to Home
    </a>

    <section class="hero-section">
        
        <div class="glass-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle mb-3" style="width: 70px; height: 70px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                    <i class="bi bi-person-fill text-primary" style="font-size: 2.5rem;"></i>
                </div>
                <h2 class="fw-bold">Member Login</h2>
                <p class="small text-white-50">Sign in to access your dashboard and projects.</p>
            </div>

            <form id="loginForm" class="needs-validation" novalidate>
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold small">University Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-light text-white opacity-75">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" class="form-control glass-input border-start-0" id="email" placeholder="student@domain.edu" required>
                        <div class="invalid-feedback">Please enter a valid email address.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 border-light text-white opacity-75">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control glass-input border-start-0" id="password" placeholder="••••••••" required>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-white-50" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="text-info text-decoration-none fw-semibold">Forgot Password?</a>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary w-100 fw-bold py-2 rounded-3 mb-3 shadow">
                    Login to Portal
                </button>

                <div class="text-center small text-white-50">
                    Not a member yet? <a href="contact.html" class="text-white fw-bold">Register here</a>
                </div>
            </form>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {


            const storedEmail = localStorage.getItem('savedEmail');
            if (storedEmail) {
                $('#email').val(storedEmail);
                $('#rememberMe').prop('checked', true);
            }

       

            $('#loginForm').on('submit', function(event) {
             
                if (!this.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    event.preventDefault(); 

                    const emailInput = $('#email').val();
                    const isRemembered = $('#rememberMe').is(':checked');


                    if (isRemembered) {
                        
                        localStorage.setItem('savedEmail', emailInput);
                    } else {
                        
                        localStorage.removeItem('savedEmail');
                    }

                    //sessionStorage function
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('activeUser', emailInput);

                    $('#login-btn').html('<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authenticating...')
                                   .removeClass('btn-primary').addClass('btn-success')
                                   .prop('disabled', true);


                    setTimeout(() => {
                        alert("Login Successful! Welcome back.");
                        window.location.href = "index.html";
                    }, 1500);
                    return;
                }
                

                $(this).addClass('was-validated');
            });

        });
    </script>
</body>

</html>
