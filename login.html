<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Login - AI & Innovation Club</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b0f19 0%, #1a2a6c 50%, #b21f1f 100%);
            background-size: 200% 200%;
            animation: gradientMove 6s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 30px 15px;
            color: #ffffff;
        }

        .btn-back-home {
            position: absolute;
            top: 24px;
            left: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 0.875rem;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .btn-back-home:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            transform: translateX(-3px);
        }

        .login-card-container {
            width: 100%;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }

        .avatar-circle {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: #3b82f6;
            font-size: 34px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

        .custom-input-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 2px 14px;
            transition: all 0.25s ease;
        }

        .custom-input-box:focus-within {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        .custom-input-box i {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .custom-input-box .form-control {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: #ffffff !important;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        .custom-input-box .form-control::placeholder {
            color: #64748b;
        }

        .pwd-toggle-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 0 4px;
        }

        .pwd-toggle-btn:hover {
            color: #ffffff;
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #38bdf8;
            border-color: #38bdf8;
        }

        .form-check-label {
            font-size: 0.85rem;
            color: #cbd5e1;
            user-select: none;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: #38bdf8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .btn-portal-submit {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-portal-submit:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        .register-footer-text {
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 22px;
            margin-bottom: 0;
        }

        .register-footer-text a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        .register-footer-text a:hover {
            text-decoration: underline;
            color: #38bdf8;
        }
    </style>
</head>

<body>

    <a href="index.html" class="btn-back-home">
        <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <div class="login-card-container">
        <div class="text-center">
            <div class="avatar-circle">
                <i class="bi bi-person-fill"></i>
            </div>
            <h3 class="fw-bold mb-1">Member Login</h3>
            <p class="small mb-4" style="color: #94a3b8;">Sign in to access your dashboard and projects.</p>
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3 text-start">
                <label class="form-label" for="loginEmail">University Email</label>
                <div class="custom-input-box">
                    <i class="bi bi-envelope"></i>
                    <input type="email" class="form-control" id="loginEmail" placeholder="student@domain.edu" required>
                </div>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label" for="loginPassword">Password</label>
                <div class="custom-input-box">
                    <i class="bi bi-lock"></i>
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                    <button type="button" class="pwd-toggle-btn" id="togglePasswordBtn">
                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check m-0 d-flex align-items-center gap-2">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-portal-submit">Login to Portal</button>

            <p class="register-footer-text">
                Not a member yet? <a href="contact.html">Register here</a>
            </p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        $(document).ready(function () {
            if (localStorage.getItem("rememberUser") === "true") {
                $('#loginEmail').val(localStorage.getItem("savedEmail") || "");
                $('#loginPassword').val(localStorage.getItem("savedPassword") || "");
                $('#rememberMe').prop('checked', true);
            }

            $('#togglePasswordBtn').on('click', function () {
                const passwordInput = $('#loginPassword');
                const icon = $('#togglePasswordIcon');
                if (passwordInput.attr('type') === 'password') {
                    passwordInput.attr('type', 'text');
                    icon.removeClass('bi-eye').addClass('bi-eye-slash');
                } else {
                    passwordInput.attr('type', 'password');
                    icon.removeClass('bi-eye-slash').addClass('bi-eye');
                }
            });

            $('#forgotPasswordLink').on('click', function (e) {
                e.preventDefault();
                alert("Please contact club support at junxian0409@1utar.my to reset your password.");
            });

            $('#loginForm').on('submit', function (e) {
                e.preventDefault();

                const email = $('#loginEmail').val().trim();
                const password = $('#loginPassword').val();
                const isRemembered = $('#rememberMe').is(':checked');

                if (!email || !password) {
                    alert("Please fill in both email and password.");
                    return;
                }

                if (isRemembered) {
                    localStorage.setItem("rememberUser", "true");
                    localStorage.setItem("savedEmail", email);
                    localStorage.setItem("savedPassword", password);
                } else {
                    localStorage.removeItem("rememberUser");
                    localStorage.removeItem("savedEmail");
                    localStorage.removeItem("savedPassword");
                }

                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("activeUser", email);

                alert("Login Successful! Welcome, " + email.split('@')[0]);
                window.location.href = "index.html";
            });
        });
    </script>
</body>

</html>
