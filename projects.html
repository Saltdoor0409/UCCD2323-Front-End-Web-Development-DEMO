    <header class="hero-section text-white d-flex align-items-center justify-content-center text-center py-5">

            <h1 class="display-4 fw-bold mb-3">Projects</h1>

                Explore the projects provided by our committee members.
            </p>

    <main class="container my-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div class="btn-group flex-wrap" role="group" id="filter-buttons">
                <button type="button" class="btn btn-primary filter-btn active" data-filter="all">All Projects</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="cv">Computer Vision</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="nlp">NLP / LLMs</button>
                <button type="button" class="btn btn-outline-primary filter-btn" data-filter="robotics">Robotics</button>
            </div>
            <button id="show-saved-btn" class="btn btn-outline-danger rounded-pill fw-semibold">
                <i class="bi bi-heart-fill me-1"></i> Saved Projects (<span id="saved-count">0</span>)
            </button>
        </div>

        </div>

                <a href="contact.html" class="text-white-50 me-3 text-decoration-none"><i class="bi bi-discord fs-5"></i></a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        const projects = [
            {
                id: "proj-1",
                title: "Autonomous Drone Navigation",
                category: "robotics",
                badge: "Robotics & CV",
                author: "Alex Wong",
                description: "Real-time obstacle avoidance and path planning algorithm running on embedded Edge AI hardware.",
                image: "https://images.unsplash.com/photo-1527977966376-1c8408f9f108?auto=format&fit=crop&w=600&q=80",
                githubUrl: "https://github.com/ai-club/autonomous-drone"
            },
            {
                id: "proj-2",
                title: "Medical Image Diagnostics",
                category: "cv",
                badge: "Computer Vision",
                author: "Sarah Chen",
                description: "Convolutional Neural Network (CNN) designed to detect early signs of retinal disease from fundus scans.",
                image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=600&q=80",
                githubUrl: "https://github.com/ai-club/medical-imaging-diagnostics"
            },
            {
                id: "proj-3",
                title: "Campus AI Assistant",
                category: "nlp",
                badge: "NLP / LLMs",
                author: "Michael Lee",
                description: "Retrieval-Augmented Generation (RAG) chatbot trained on university course documentation and schedules.",
                image: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=600&q=80",
                githubUrl: "https://github.com/ai-club/campus-rag-assistant"
            },
            {
                id: "proj-4",
                title: "Real-time Emotion Detector",
                category: "cv",
                badge: "Computer Vision",
                author: "Priya Patel",
                description: "Facial landmark tracking combined with lightweight classification models running directly in web browsers.",
                image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=600&q=80",
                githubUrl: "https://github.com/ai-club/emotion-detector-js"
            },
            {
                id: "proj-5",
                title: "Sudoku Solver with Java GUI",
                category: "nlp",
                badge: "NLP",
                author: "Saltdoor0409",
                description: "Fine-tuned open-source model that automatically solves Sudoku puzzles.",
                image: "image/project.code.avif",
                githubUrl: "https://github.com/Saltdoor0409/Sudoku-Solver-with-Java-GUI-Version-"
            },
            {
                id: "proj-6",
                title: "Robotic Arm Sorting System",
                category: "robotics",
                badge: "Robotics",
                author: "Elena Rostova",
                description: "Industrial arm powered by reinforcement learning to automatically categorize recyclable materials.",
                image: "image/project.robot.png",
                githubUrl: "https://github.com/ai-club/robotic-arm-sorting"
            }
        ];

        const STORAGE_KEY = 'ai_club_favorite_projects';

        function getSavedProjects() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : [];
        }

        function saveProjectsToStorage(savedArray) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(savedArray));
            updateSavedBadgeCount();
        }

        function toggleFavorite(projectId) {
            let saved = getSavedProjects();
            if (saved.includes(projectId)) {
                saved = saved.filter(id => id !== projectId);
            } else {
                saved.push(projectId);
            }
            saveProjectsToStorage(saved);
            renderProjects();
        }

        function updateSavedBadgeCount() {
            const saved = getSavedProjects();
            document.getElementById('saved-count').innerText = saved.length;
        }

        let currentFilter = 'all';
        let showOnlySaved = false;

        function renderProjects() {
            const container = document.getElementById('projects-container');
            const savedIds = getSavedProjects();

            const filteredProjects = projects.filter(project => {
                const matchesCategory = (currentFilter === 'all' || project.category === currentFilter);
                const matchesSaved = showOnlySaved ? savedIds.includes(project.id) : true;
                return matchesCategory && matchesSaved;
            });

            if (filteredProjects.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-journal-x display-1 text-muted"></i>
                        <h4 class="mt-3 text-muted">No projects found.</h4>
                        <p class="text-secondary">${showOnlySaved ? "You haven't saved any projects in this category yet." : "Check back later for new updates!"}</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredProjects.map(project => {
                const isSaved = savedIds.includes(project.id);
                return `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm project-card position-relative">
                            <button 
                                class="bookmark-btn ${isSaved ? 'active' : ''}" 
                                onclick="toggleFavorite('${project.id}')"
                                title="${isSaved ? 'Remove from favorites' : 'Bookmark project'}"
                                aria-label="Bookmark project"
                            >
                                <i class="bi ${isSaved ? 'bi-heart-fill' : 'bi-heart'}"></i>
                            </button>
                            <img src="${project.image}" class="card-img-top" alt="${project.title}" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <div class="mb-2">
                                    <span class="badge bg-primary opacity-75">${project.badge}</span>
                                </div>
                                <h5 class="card-title fw-bold text-dark">${project.title}</h5>
                                <p class="card-text text-secondary flex-grow-1">${project.description}</p>
                                <div class="pt-3 border-top mt-auto d-flex justify-content-between align-items-center">
                                    <small class="text-muted"><i class="bi bi-person me-1"></i>${project.author}</small>
                                    ${project.githubUrl ? `
                                        <a href="${project.githubUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-dark rounded-pill">
                                            <i class="bi bi-github me-1"></i> Code
                                        </a>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('filter-buttons').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('btn-primary', 'active');
                    btn.classList.add('btn-outline-primary');
                });
                e.target.classList.remove('btn-outline-primary');
                e.target.classList.add('btn-primary', 'active');

                currentFilter = e.target.getAttribute('data-filter');
                renderProjects();
            }
        });

        document.getElementById('show-saved-btn').addEventListener('click', function() {
            showOnlySaved = !showOnlySaved;
            if (showOnlySaved) {
                this.classList.remove('btn-outline-danger');
                this.classList.add('btn-danger');
            } else {
                this.classList.remove('btn-danger');
                this.classList.add('btn-outline-danger');
            }
            renderProjects();
        });

        document.addEventListener('DOMContentLoaded', () => {
            updateSavedBadgeCount();
            renderProjects();
        });
    </script>
</body>
